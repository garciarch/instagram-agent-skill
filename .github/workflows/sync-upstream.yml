name: Sync Instagram Agent upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Create a version-bumping release to test Claude automatic sync'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: instagram-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
    steps:
      - name: Authenticate and clone the owned fork
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GH_REPO" release-repo
      - name: Synchronize upstream and merge a version-bumping release PR
        working-directory: release-repo
        run: python3 .github/scripts/sync_upstream.py
